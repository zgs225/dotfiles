# Picom compositor config — juansha liuli (Song liquid glass)

backend = "glx";
vsync = true;

# Shadows — shallow and close, "lying on silk" not "floating card"
shadow = true;
shadow-radius = 12;
shadow-offset-x = 0;
shadow-offset-y = 4;
shadow-opacity = 0.35;
shadow-clipping = true;
shadow-exclude = [
    # fullscreen (video) windows: bypass the compositor look entirely
    "fullscreen = true",
    "name = 'Eww - bar'",
    "name = 'Eww - popup-scrim'",
    "name = 'Notification'",
    "name = 'Eww - rec-frame'",
    "class_g = 'slop'",
    # greeter: defense-in-depth — if a compositor ever runs in the greeter
    # session, the fullscreen ARGB window's alpha silhouette would catch a
    # hard shadow slab and active-opacity would muddy the token alpha
    "class_g *= 'lightdm'",
];

# Fading — snappy
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 4;

# Opacity — frosted glass layering
inactive-opacity = 0.70;
active-opacity = 0.85;
frame-opacity = 0.80;
inactive-opacity-override = false;

opacity-rule = [
    # first-match wins — fullscreen (video) windows must never be translucent
    "100:fullscreen",
    "1:name = 'Eww - popup-scrim'",
    "100:name = 'Eww - bar'",
    "100:class_g = 'Rofi'",
    "100:class_g = 'Dunst'",
    "95:class_g = 'org.wezfurlong.wezterm'",
    # keep the ticket's token alpha exact (0.65 silk, not 0.65*0.85 mud)
    "100:class_g *= 'lightdm'",
];

# Blur — dual_kawase, wallpaper becomes pure ink wash through glass
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 8;
blur-background-frame = false;
blur-background-fixed = true;

blur-background-exclude = [
    "name = 'Eww - popup-scrim'",
    "class_g = 'slop'",
    "window_type = 'desktop'",
];

# Rounded corners — global 5px (Song restraint, no iOS bubbles)
corner-radius = 5;
detect-rounded-corners = true;

rounded-corners-exclude = [
    "fullscreen = true",
    "name = 'Eww - popup-scrim'",
    "name = 'Eww - bar'",
    "name = 'Eww - rec-frame'",
    "class_g = 'slop'",
    "window_type = 'desktop'",
];

corner-radius-rules = [
    "0:class_g = 'Rofi'",
];

# Misc
# fullscreen opaque window -> unredirect screen (video bypasses compositor);
# delay smooths the enter/exit transition to avoid a flash
unredir-if-possible = true;
unredir-if-possible-delay = 200;
no-fading-openclose = false;
no-fading-destroyed-argb = true;
detect-client-opacity = true;
detect-transient = true;

# Window type settings
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.90; focus = true; full-shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 1.0; };
    dropdown_menu = { opacity = 1.0; };
};
