# Per-window overrides for keyd-application-mapper.
# Read at startup by `keyd-application-mapper -d` (started by i3).
# No manual reload needed: the mapper re-parses this file automatically on
# every active-window change when the mtime differs (on_window_change in
# /usr/bin/keyd-application-mapper), then pushes bindings via `keyd bind
# reset`. USR1 only interrupts the event loop, it does NOT reload config.
#
# The global Alt→Ctrl-c/v/x/a remap is defined in /etc/keyd/default.conf
# (managed externally). Entries here cancel that remap for matching
# windows so the app sees its native Alt bindings.

[org-wezfurlong-wezterm]
alt.c = A-c
alt.v = A-v
alt.x = A-x
alt.w = A-w
alt.t = A-t
alt.a = A-a
# [alt] layer has no explicit [ / ] bindings; without these keyd falls
# through to the [alt+shift] layer (leftbrace/rightbrace) and emits
# Alt+Shift+[ / Alt+Shift+], breaking ActivateTabRelative. Pin them.
alt.[ = A-[
alt.] = A-]

# Dropdown terminal (pi session) is also wezterm --class dropdown-pi;
# without this section the global [alt] layer remaps Alt+v -> Ctrl+v etc.
[dropdown-pi]
alt.c = A-c
alt.v = A-v
alt.x = A-x
alt.w = A-w
alt.t = A-t
alt.a = A-a
alt.[ = A-[
alt.] = A-]

[thunar]
alt.backspace = delete
enter = F2

# The global [alt] layer turns Alt+w into C-w. In Bitwarden (Electron)
# Ctrl+W closes the app outright, bypassing its "close to tray" handler,
# which only intercepts WM_DELETE_WINDOW. So send a real graceful close
# instead — that goes to tray as configured. The helper resolves
# DISPLAY/XAUTHORITY at runtime (keyd daemon has no X env); it is
# deployed to /usr/local/bin by eos-bootstrap.
# NOTE: command() is a top-level action — wrapping it in macro() would
# type the expression as literal text.
[bitwarden]
alt.w = command(xclose-active-window)

[google-chrome]
alt.[ = C-S-tab
alt.] = macro(C-tab)
alt.l = macro(C-l)
alt.w = macro(C-w)
alt.t = macro(C-t)
alt.n = macro(C-n)
alt.r = macro(C-r)
control.n = down
control.p = up

# Apps without a native Ctrl+W binding fall through the global [alt] layer
# (Alt+w → C-w) into nothing — the key event is silently ignored. So give
# them the same macOS Cmd+W semantics via WM_DELETE_WINDOW instead:
# - Clash Verge Rev (Tauri): CloseRequested → prevent_close + hide to tray
#   (verified in src-tauri/src/lib.rs), i.e. close = hide, never quit.
# - nsxiv: key table has no Ctrl+w; WM_DELETE quits it like pressing q.

[clash-verge]
alt.w = command(xclose-active-window)

[nsxiv]
alt.w = command(xclose-active-window)

# WeChat (Linux native): no Ctrl+W handling; WM_DELETE on the main window
# hides to tray (process survives), on an independent chat/preview window
# closes just that window. WeChatAppEx (mini-program/webview runtime) is a
# separate class for its own top-level windows. (E2E-validated 2026-10-12.)
[wechat]
alt.w = command(xclose-active-window)

[wechatappex]
alt.w = command(xclose-active-window)

# More apps without a native Ctrl+W close (Alt+w → C-w falls through into
# nothing), same WM_DELETE treatment. Section names use the mapper's
# normalized form (res_class: non-alnum → '-', lowercase — dots in class
# names like com.alibabainc.dingtalk must be written as dashes).
# - DingTalk (Qt): WM_DELETE on main window minimizes to tray; sub-windows
#   close individually.
# - qqmusic / baidunetdisk: Electron tray apps.
# - wemeetapp: Tencent Meeting Qt client, no Ctrl+W.
# - cloud-drive-ui: Synology Drive Qt tray client.
# - mpv: default key table has Ctrl+w commented out.
# - zathura / feh / satty / xarchiver: keyboard-driven tools that only
#   bind q/Escape; WM_DELETE quits them like their native quit key.
[com-alibabainc-dingtalk]
alt.w = command(xclose-active-window)

[qqmusic]
alt.w = command(xclose-active-window)

[baidunetdisk]
alt.w = command(xclose-active-window)

[wemeetapp]
alt.w = command(xclose-active-window)

[cloud-drive-ui]
alt.w = command(xclose-active-window)

[mpv]
alt.w = command(xclose-active-window)

[org-pwmt-zathura]
alt.w = command(xclose-active-window)

[feh]
alt.w = command(xclose-active-window)

[com-gabm-satty]
alt.w = command(xclose-active-window)

[xarchiver]
alt.w = command(xclose-active-window)
