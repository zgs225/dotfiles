# Per-window overrides for keyd-application-mapper.
# Read at startup by `keyd-application-mapper -d` (started by i3).
# Reload after edits: kill -USR1 $(pgrep -f keyd-application-mapper)
#
# The global Alt→Ctrl-c/v/x/a remap is defined in /etc/keyd/default.conf
# (managed externally). Entries here cancel that remap for matching
# windows so the app sees its native Alt bindings.

[org-wezfurlong-wezterm]
alt.c = A-c
alt.v = A-v
alt.x = A-x
alt.w = A-w
alt.t = A-t
alt.a = A-a

[thunar]
alt.backspace = delete
enter = F2

# The global [alt] layer turns Alt+w into C-w. In Bitwarden (Electron)
# Ctrl+W closes the app outright, bypassing its "close to tray" handler,
# which only intercepts WM_DELETE_WINDOW. So send a real graceful close
# instead — that goes to tray as configured. The helper resolves
# DISPLAY/XAUTHORITY at runtime (keyd daemon has no X env); it is
# deployed to /usr/local/bin by eos-bootstrap.
# NOTE: command() is a top-level action — wrapping it in macro() would
# type the expression as literal text.
[bitwarden]
alt.w = command(xclose-active-window)

[google-chrome]
alt.[ = C-S-tab
alt.] = macro(C-tab)
alt.l = macro(C-l)
alt.w = macro(C-w)
alt.t = macro(C-t)
alt.n = macro(C-n)
alt.r = macro(C-r)
control.n = down
control.p = up
