# Managed by chezmoi — edit the source, not this file.
# System defaults live in /etc/paru.conf; options here only add to them.
[options]
# Untracked files (downloaded upstream sources, built *.pkg.tar.zst) are
# removed after a successful install. Directories are kept, so VCS (-git)
# sources can still be updated with a pull instead of a full re-clone.
# Without this, ~/.cache/paru/clone grows unbounded (hit 45G).
CleanAfter
