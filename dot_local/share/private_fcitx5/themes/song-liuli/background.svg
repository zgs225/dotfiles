  <rect x="0.5" y="0.5" width="23" height="23" rx="4.5" ry="4.5"
        fill="#1a1a1e" fill-opacity="0.65"
        stroke="#9ec8c0" stroke-opacity="0.35" stroke-width="1"/>
</svg>
