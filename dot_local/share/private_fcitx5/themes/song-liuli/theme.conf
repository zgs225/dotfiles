# 绢纱琉璃 · 宋式极简 — fcitx5 候选窗 / 菜单主题
# 令牌唯一来源：~/.local/share/chezmoi/docs/design/song-liquid-glass.md（§2.1 色板、§2.2 层级、§2.3 发丝线、§4.3 弹层）
# 禁止在本文件出现令牌以外的色值。
#
#   bg_base      #1a1a1e @ 0.65   -> #1a1a1ea6   L2 功能面板（对齐 eww .popup）
#   fg_primary   #e8e6df                        正文 / 候选词 / preedit
#   fg_secondary #9a9a92                        序号 / 注释（次信息）
#   accent       #9ec8c0                        发丝线 .35 / 高亮淡染 .14 / 选中序号
#   ink          #2e2e36                        菜单分隔线
#   圆角 5px（背景九片自绘）、高亮圆角 3px、发丝线 1px
#
# 可读性优先（用户裁定 2026-10-21）：
#   候选正文一律月白，不因高亮而降级；淡染只做"当前行"的余光定位，不参与文字配色。
#   横排 6 候选（Vertical Candidate List=False），不用界引竖条。

[Metadata]
Name=Song Liu Li
Name[zh_CN]=绢纱琉璃
Version=1
Author=yuez
Description=绢纱琉璃 · 宋式极简 — 候选窗与菜单
ScaleWithDPI=True

[InputPanel]
NormalColor=#e8e6df
HighlightColor=#e8e6df
HighlightCandidateColor=#e8e6df
HighlightBackgroundColor=#9ec8c024
CandidateLabelColor=#9a9a92
LabelTextSizeFactor=85
HighlightCandidateLabelColor=#9ec8c0
CandidateCommentColor=#9a9a92
CommentTextSizeFactor=75
HighlightCandidateCommentColor=#cfccc2
FullWidthHighlight=True
PageButtonAlignment=Last Candidate

# 面板：5px 圆角 + 1px 天青发丝线 + 墨底 0.65 由 nine-slice 背景图自绘。
# Color/BorderColor 仅在 Image 加载失败时兜底。
[InputPanel/Background]
Image=background.svg
Color=#1a1a1ea6
BorderColor=#9ec8c059
BorderWidth=1

[InputPanel/Background/Margin]
Left=8
Right=8
Top=8
Bottom=8

# 高亮：仅天青 14% 淡染（用户裁定去掉界引竖条），3px 圆角
[InputPanel/Highlight]
Image=highlight.svg
Color=#9ec8c024

[InputPanel/Highlight/Margin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/ContentMargin]
Left=6
Right=6
Top=5
Bottom=5

[InputPanel/TextMargin]
Left=6
Right=6
Top=3
Bottom=3

# ---- 输入法切换菜单 / 右键菜单：同 §4.5 弹层规范 ----
[Menu]
NormalColor=#e8e6df
HighlightCandidateColor=#e8e6df

[Menu/Background]
Image=background.svg
Color=#1a1a1ea6
BorderColor=#9ec8c059
BorderWidth=1

[Menu/Background/Margin]
Left=8
Right=8
Top=8
Bottom=8

[Menu/ContentMargin]
Left=6
Right=6
Top=5
Bottom=5

[Menu/TextMargin]
Left=6
Right=6
Top=4
Bottom=4

[Menu/Highlight]
Image=highlight.svg
Color=#9ec8c024

[Menu/Highlight/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/Separator]
Color=#2e2e36
